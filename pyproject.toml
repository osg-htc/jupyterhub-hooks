# Project requirements (PEP 518, https://python-poetry.org)


[project]
name = "osg_jupyterhub_hooks"
version = "7.2.0"
description = "KubeSpawner hooks for OSG's JupyterHub instance"
license = "Apache-2.0"
authors = [{ name = "Brian Aydemir", email = "baydemir@morgridge.org" }]


[project.urls]
repository = "https://github.com/osg-htc/jupyterhub-hooks"

[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core>=2.0.0,<3.0.0"]


[tool.black]
line-length = 96
target-version = ["py312", "py313", "py314"]


[tool.isort]
line_length = 96
profile = "black"


[tool.mypy]
# Reference: https://mypy.readthedocs.io/en/stable/config_file.html

# Import discovery
explicit_package_bases = true
follow_untyped_imports = true

# Untyped definitions and calls
check_untyped_defs = true

# Configuring warnings
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = true

# Configuring error messages
pretty = true

# Incremental mode
sqlite_cache = true


[tool.poetry]
package-mode = true
packages = [{ include = "osg" }]


[tool.poetry.dependencies]
# These dependencies are intended for quay.io/jupyterhub/k8s-hub:4.2.0.
python = "^3.12"
cryptography = "^42"
jupyterhub = "^5.3"
kubernetes-asyncio = "^29"
PyJWT = "~2.8"
PyYAML = "~6.0"
tornado = "^6.4"
typing-extensions = "^4"

## Other dependencies.
baydemir = { git = "https://github.com/brianaydemir/pythonlib.git", tag = "1.0.1" }


[tool.poetry.group.dev.dependencies]
bandit = "~1.9"
black = "~26.5"
isort = "~8.0"
mdformat = "~1.0"
mdformat-gfm = "~1.0"
mdformat-gfm-alerts = "~2.0"
mypy = "~2.3"
pre-commit = "~4.6"
pylint = "~4.0"
pyright = "~1.1"
types-PyYAML = "~6.0"
typos = "~1.48"


[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.0.0"


[tool.pyright]
typeCheckingMode = "strict"

# Be more forgiving.
reportMissingTypeStubs = "none"

# Be less forgiving.
deprecateTypingAliases = true
reportImplicitOverride = true
reportImplicitStringConcatenation = true
reportPropertyTypeMismatch = true
reportUnnecessaryTypeIgnoreComment = true
reportUnreachable = true


[tool.pylint.messages-control]
max-line-length = 96
enable = [
    "useless-suppression",
]
disable = [
    "duplicate-code",
    "line-too-long",
    "too-many-arguments",
    "too-many-positional-arguments",
]
